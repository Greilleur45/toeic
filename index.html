<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>TOEIC 850</title>
<meta name="theme-color" content="#08090f" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#f3f5fa" media="(prefers-color-scheme: light)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="TOEIC">
<meta name="robots" content="noindex">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap">
<link rel="stylesheet" href="css/style.css">
<script src="vendor/qrcode.js" defer></script>
<script type="module" src="js/app.js"></script>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <linearGradient id="g-acc" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" style="stop-color:var(--acc1)"/><stop offset="1" style="stop-color:var(--acc2)"/>
    </linearGradient>
    <linearGradient id="g-area" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" style="stop-color:var(--acc1)" stop-opacity=".28"/><stop offset="1" style="stop-color:var(--acc1)" stop-opacity="0"/>
    </linearGradient>
  </defs>
</svg>
<div class="glow" aria-hidden="true"></div>
<header>
  <div class="brand">
    <span class="logo-mark" aria-hidden="true">
      <svg viewBox="0 0 24 24"><path d="M5 18V8l7-4 7 4v10M9 18v-5h6v5" fill="none" stroke="url(#g-acc)" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </span>
    <span class="logo">TOEIC<b>850</b></span>
  </div>
  <button id="sync" class="sync s-off" aria-label="État de la synchronisation"><i></i><span>Hors synchro</span></button>
</header>
<div id="progress" hidden><i></i></div>
<main id="view"></main>
<div id="toast" hidden></div>
<div id="sheet" hidden></div>
<canvas id="confetti" aria-hidden="true"></canvas>
<nav>
  <span class="nav-ind" aria-hidden="true"></span>
  <button data-tab="today">
    <svg viewBox="0 0 24 24"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/></svg>Ce soir</button>
  <button data-tab="learn">
    <svg viewBox="0 0 24 24"><path d="M4 5.5A2.5 2.5 0 0 1 6.5 3H20v15H6.5A2.5 2.5 0 0 0 4 20.5zM4 20.5A2.5 2.5 0 0 0 6.5 23H20v-5"/></svg>Apprendre</button>
  <button data-tab="ge">
    <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M12 7v5l3.5 2"/></svg>Global Exam</button>
  <button data-tab="stats">
    <svg viewBox="0 0 24 24"><path d="M4 19h16M6 15l4-5 3.5 3L19 6"/></svg>Progrès</button>
  <button data-tab="settings">
    <svg viewBox="0 0 24 24"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg>Réglages</button>
</nav>
</body>
</html>
